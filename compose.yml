services:
  redis:
    image: redis:7-alpine
    container_name: biotech_redis
    restart: unless-stopped
    command: [ "redis-server", "--save", "60", "1", "--loglevel", "warning" ]
    volumes:
      - redis_data:/data
    networks: [ biotech ]
    #ports:
    #  - "6379:6379"

  biotech_bot_1:
    build: .
    image: biotechware-bot:latest
    container_name: biotech_bot_1
    restart: unless-stopped
    depends_on: [ redis ]
    environment:
      USER_LABEL: ${BOT1_USER_LABEL}
      BTW_USERNAME: ${BOT1_BTW_USERNAME}
      BTW_PASSWORD: ${BOT1_BTW_PASSWORD}
      TG_TOKEN: ${TG_TOKEN}
      TG_CHAT_ID: ${BOT1_TG_CHAT_ID}
      REDIS_URL: redis://redis:6379
      PRICING_FILE: /app/pricing.toml
      METRICS_ADDR: 0.0.0.0:9090
      CHECKER_INTERVAL_SECS: "180"
      RESUMES_INTERVAL_SECS: "21600"
      FETCH_MAX_CONCURRENT: ${FETCH_MAX_CONCURRENT:-8}
      RUST_LOG: debug
    ports:
      - "9091:9090"
    networks: [ biotech ]

  biotech_bot_2:
    build: .
    image: biotechware-bot:latest
    container_name: biotech_bot_2
    restart: unless-stopped
    depends_on: [ redis ]
    environment:
      USER_LABEL: ${BOT2_USER_LABEL}
      BTW_USERNAME: ${BOT2_BTW_USERNAME}
      BTW_PASSWORD: ${BOT2_BTW_PASSWORD}
      TG_TOKEN: ${TG_TOKEN}
      TG_CHAT_ID: ${BOT2_TG_CHAT_ID}
      REDIS_URL: redis://redis:6379
      PRICING_FILE: /app/pricing.toml
      METRICS_ADDR: 0.0.0.0:9090
      CHECKER_INTERVAL_SECS: "180"
      RESUMES_INTERVAL_SECS: "21600"
      FETCH_MAX_CONCURRENT: ${FETCH_MAX_CONCURRENT:-8}
      RUST_LOG: info,biotechware_bot=debug
    ports:
      - "9092:9090"
    networks: [ biotech ]

volumes:
  redis_data:

networks:
  biotech:
    driver: bridge
